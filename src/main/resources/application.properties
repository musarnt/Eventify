# Application
spring.application.name=eventify

# H2 datasource (file mode, persists in ./data/eventifydb.mv.db)
spring.datasource.url=jdbc:h2:file:./data/eventifydb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate — schema managed by Flyway, Hibernate only validates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SQL parameter logging (BasicBinder=TRACE equivalent for Hibernate 7)
logging.level.org.hibernate.orm.jdbc.bind=trace

# Flyway database migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Verbose Flyway logging
logging.level.org.flywaydb=DEBUG

# Swagger only scans API endpoints, not admin views
springdoc.paths-to-match=/api/**

# H2 web console (available at http://localhost:8080/h2-console)
