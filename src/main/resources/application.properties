# Application
spring.application.name=eventify

# H2 datasource (in-memory)

# Ahora (file mode, persiste en ./data/eventifydb.mv.db)
spring.datasource.url=jdbc:h2:file:./data/eventifydb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger only scans API endpoints, not admin views
springdoc.paths-to-match=/api/**

# H2 web console (available at http://localhost:8080/h2-console)