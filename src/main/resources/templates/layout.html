<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: 'Eventify Admin'">Eventify Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<!-- Shared navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/admin/events}">Eventify</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/admin/events}">Events</a>
            <a class="nav-link" th:href="@{/admin/venues}">Venues</a>
        </div>
    </div>
</nav>

<!-- Page content injected here by child templates -->
<div class="container" th:replace="~{${view} :: content}">
    <!-- Child template content will replace this div -->
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
