<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="content" class="container">

    <div class="form-card">
        <h2 class="form-title"
            th:text="${category.id != null} ? 'Edit Category' : 'New Category'">Category Form</h2>

        <div th:if="${error}" class="alert-error" th:text="${error}"></div>

        <form th:action="@{/admin/categories/save}" th:object="${category}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="form-group">
                <label for="name" class="form-label">Name</label>
                <input type="text" id="name" th:field="*{name}" required maxlength="100" class="form-input">
            </div>

            <div class="form-group">
                <label for="description" class="form-label">Description</label>
                <textarea id="description" th:field="*{description}" rows="3" maxlength="500" class="form-input"></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-accent">Save</button>
                <a th:href="@{/admin/categories}" class="btn btn-cancel">Cancel</a>
            </div>
        </form>
    </div>

</div>
</html>
