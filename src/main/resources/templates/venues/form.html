<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="content">

    <h2 th:text="${venue.id != null} ? 'Edit Venue' : 'New Venue'">Venue Form</h2>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/admin/venues/save}" th:object="${venue}" method="post">
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name"
                   th:field="*{name}" required maxlength="150">
        </div>

        <div class="mb-3">
            <label for="address" class="form-label">Address</label>
            <input type="text" class="form-control" id="address"
                   th:field="*{address}" required maxlength="255">
        </div>

        <div class="mb-3">
            <label for="capacity" class="form-label">Capacity</label>
            <input type="number" class="form-control" id="capacity"
                   th:field="*{capacity}" required min="1">
        </div>

        <button type="submit" class="btn btn-success">Save</button>
        <a th:href="@{/admin/venues}" class="btn btn-secondary">Cancel</a>
    </form>

</div>
</html>
