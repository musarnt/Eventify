<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="content" class="container">

    <div class="form-card">
        <h2 class="form-title"
            th:text="${venue.id != null} ? 'Edit Venue' : 'New Venue'">Venue Form</h2>

        <div th:if="${error}" class="alert-error" th:text="${error}"></div>

        <form th:action="@{/admin/venues/save}" th:object="${venue}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="form-group">
                <label for="name" class="form-label">Name</label>
                <input type="text" id="name" th:field="*{name}" required maxlength="150" class="form-input">
            </div>

            <div class="form-group">
                <label for="address" class="form-label">Address</label>
                <input type="text" id="address" th:field="*{address}" required maxlength="255" class="form-input">
            </div>

            <div class="form-group">
                <label for="city" class="form-label">City</label>
                <input type="text" id="city" th:field="*{city}" required maxlength="100" class="form-input">
            </div>

            <div class="form-group">
                <label for="capacity" class="form-label">Capacity</label>
                <input type="number" id="capacity" th:field="*{capacity}" required min="1" class="form-input">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-accent">Save</button>
                <a th:href="@{/admin/venues}" class="btn btn-cancel">Cancel</a>
            </div>
        </form>
    </div>

</div>
</html>
