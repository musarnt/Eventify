<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- This template is injected into layout.html via the "content" fragment -->
<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Events</h2>
        <a th:href="@{/admin/events/new}" class="btn btn-primary">+ New Event</a>
    </div>

    <!-- Empty state message -->
    <div th:if="${events.isEmpty()}" class="alert alert-info">
        No events found. Create one to get started!
    </div>

    <!-- Events table (only shown when there are events) -->
    <table th:unless="${events.isEmpty()}" class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Date</th>
            <th>Description</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="event : ${events}">
            <td th:text="${event.id}"></td>
            <td th:text="${event.name}"></td>
            <td th:text="${event.date}"></td>
            <td th:text="${event.description}"></td>
            <td>
                <a th:href="@{/admin/events/edit/{id}(id=${event.id})}"
                   class="btn btn-sm btn-warning">Edit</a>
                <a th:href="@{/admin/events/delete/{id}(id=${event.id})}"
                   class="btn btn-sm btn-danger"
                   onclick="return confirm('Are you sure?')">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

</div>
</html>
