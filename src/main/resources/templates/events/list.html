<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="content" class="container">

    <div class="page-header">
        <h2 class="page-title">Events</h2>
        <a th:href="@{/admin/events/new}" class="btn btn-accent">+ New Event</a>
    </div>

    <div th:if="${events.isEmpty()}" class="empty-state">
        No events yet. Create your first one.
    </div>

    <div th:unless="${events.isEmpty()}" class="table-wrapper">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Date</th>
                <th>Venue</th>
                <th>Categories</th>
                <th>Description</th>
                <th style="text-align:center">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="event : ${events}">
                <td th:text="${event.id}"></td>
                <td class="td-name" th:text="${event.name}"></td>
                <td th:text="${event.date}"></td>
                <td th:text="${event.venue.name}"></td>
                <td class="td-desc">
                    <span th:each="cat, iter : ${event.categories}"
                          th:text="${cat.name + (iter.last ? '' : ', ')}"></span>
                </td>
                <td class="td-desc" th:text="${event.description}"></td>
                <td class="td-actions">
                    <a th:href="@{/admin/events/edit/{id}(id=${event.id})}" class="btn btn-edit">Edit</a>
                    <a th:href="@{/admin/events/delete/{id}(id=${event.id})}" class="btn btn-delete"
                       onclick="return confirm('This will deactivate the event. Continue?')">Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="pagination" th:if="${slice != null}">
        <a th:if="${slice.hasPrevious()}"
           th:href="@{/admin/events(page=${slice.number - 1}, size=${slice.size})}"
           class="btn btn-edit">Previous</a>
        <span th:if="${!slice.hasPrevious()}" class="btn btn-disabled">Previous</span>

        <span class="page-indicator" th:text="'Page ' + (${slice.number} + 1)"></span>

        <a th:if="${slice.hasNext()}"
           th:href="@{/admin/events(page=${slice.number + 1}, size=${slice.size})}"
           class="btn btn-edit">Next</a>
        <span th:if="${!slice.hasNext()}" class="btn btn-disabled">Next</span>
    </div>

</div>
</html>
